name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/backend/go.mod
          cache-dependency-path: app/backend/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run knip
      - run: npm test

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the application image
        run: docker build -t emremote:ci ./app

  # The whole product against real servers: the stack is started like a customer would start it and
  # tests/e2e/smoke.mjs drives it (sign-in, inventory, RDP/VNC/SSH/Telnet sessions through guacd,
  # file transfer, switches, users and permissions, jump host, audit log).
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/backend/go.mod
          cache-dependency-path: app/backend/go.sum
      - name: Settings for this run
        run: |
          IP="$(hostname -I | awk '{print $1}')"
          {
            echo "IP=$IP"
            echo "TARGET_PASSWORD=$(openssl rand -hex 12)"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 12)"
            echo "DATA=$RUNNER_TEMP/emremote-data"
          } >> "$GITHUB_ENV"
      - name: Test servers (SSH, RDP, VNC, Telnet, a bastion with a machine behind it)
        run: TARGET_PASSWORD="$TARGET_PASSWORD" docker compose -f tests/targets/compose.yaml up -d --build
      - name: Simulated switch
        run: |
          mkdir -p app/backend/cmd/fakeswitch
          cp tests/targets/fakeswitch/main.go app/backend/cmd/fakeswitch/
          (cd app/backend && go build -o "$RUNNER_TEMP/fakeswitch" ./cmd/fakeswitch)
          rm -rf app/backend/cmd/fakeswitch
          TARGET_PASSWORD="$TARGET_PASSWORD" nohup "$RUNNER_TEMP/fakeswitch" > "$RUNNER_TEMP/fakeswitch.log" 2>&1 &
      - name: Start emremote
        run: |
          mkdir -p "$DATA"
          cat > .env <<ENV
          EMREMOTE_SITE_ADDRESS=$IP
          EMREMOTE_DEFAULT_SNI=$IP
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          EMREMOTE_ENCRYPTION_KEY=$(openssl rand -base64 32)
          EMREMOTE_ALLOWED_TARGET_NETWORKS=$IP/32
          EMREMOTE_HTTPS_PORT=8443
          EMREMOTE_HTTP_PORT=8088
          EMREMOTE_EDGE_SUBNET=172.31.251.0/24
          EMREMOTE_DATA_DIR=$DATA
          EMREMOTE_AUTO_SSH_PORT=12222
          EMREMOTE_JUMP_TARGET_NETWORKS=172.29.77.0/24
          EMREMOTE_UPDATE_CHECK=false
          ENV
          sed -i 's/^ *//' .env
          docker compose up -d --build
          for _ in $(seq 1 60); do curl -sk "https://$IP:8443/healthz" | grep -q ok && break; sleep 3; done
          curl -sk "https://$IP:8443/healthz" | grep -q ok
          sleep 5
          # The proxy writes its data as root, so the runner needs sudo to read the certificate.
          sudo cp "$DATA/caddy/data/caddy/pki/authorities/local/root.crt" "$RUNNER_TEMP/root.crt"
          sudo chmod a+r "$RUNNER_TEMP/root.crt"
      - name: End-to-end checks
        env:
          EMREMOTE_URL: https://${{ env.IP }}:8443
          TARGET_HOST: ${{ env.IP }}
        run: NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/root.crt" node tests/e2e/smoke.mjs
      - name: Logs after a failure
        if: failure()
        run: |
          {
            docker compose ps -a
            docker compose logs --tail 40 emremote guacd caddy postgres
            cat "$RUNNER_TEMP/fakeswitch.log"
          } > "$RUNNER_TEMP/diag.txt" 2>&1 || true
          cat "$RUNNER_TEMP/diag.txt"
          # Also as an annotation, so the cause is visible without opening the log.
          echo "::error title=Diagnostics::$(tail -c 3500 "$RUNNER_TEMP/diag.txt" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
